name: Build Release APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'LICENSE.txt'
      - 'blueprints/**'
      - 'screenshots/**'
      - 'fastlane/**'
      - '.github/**'
      - 'assets/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'LICENSE.txt'
      - 'blueprints/**'
      - 'fastlane/**'
      - 'screenshots/**'
      - '.github/**'
      - 'assets/**'
  workflow_dispatch: # Run it from Actions → Build Release APK → Run workflow
    inputs:
      release:
        description: Publish a GitHub release from this run (main only)
        type: boolean
        default: false
      bump:
        description: Version bump for the release. Auto follows the commit messages since the last release.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)) }}

    steps:
    - name: Check release request
      if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref != 'refs/heads/main'
      run: |
        echo "::error::Releases can only be published from main. Choose main in the Run workflow menu."
        exit 1

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.2.1
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v3.2.1

    - name: Apply Version Bump
      id: version
      env:
        BUMP: ${{ inputs.bump || 'auto' }}
        GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
      run: |
        version="$GITVERSION_SEMVER"
        if [ "$BUMP" != "auto" ]; then
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          patch=${patch%%[-+]*}
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Bumping $BUMP from $latest to v$version"
        fi
        echo "semVer=$version" >> "$GITHUB_OUTPUT"

    - name: Check Release Tag Is New
      if: env.PUBLISH_RELEASE == 'true' && github.event_name == 'workflow_dispatch'
      run: |
        if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.semVer }}" > /dev/null; then
          echo "::error::v${{ steps.version.outputs.semVer }} has already been released. Run again with a patch, minor or major bump."
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo $KEYSTORE_BASE64 | base64 --decode > app/release.keystore
        fi

    - name: Run Unit Tests & Code Coverage
      run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace --no-daemon

    - name: Upload Test Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: app/build/reports/coverage/test/debug/

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace --no-daemon "-PversionCode=${{ github.run_number }}" "-PversionName=${{ steps.version.outputs.semVer }}"

    - name: Rename APK
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        mv "$APK_PATH" app/build/outputs/apk/release/com.novasoftware.hadoorbell-${{ steps.version.outputs.semVer }}.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: com.novasoftware.hadoorbell-${{ steps.version.outputs.semVer }}
        path: app/build/outputs/apk/release/com.novasoftware.hadoorbell-*.apk

    - name: Generate Changelog from Commits
      if: env.PUBLISH_RELEASE == 'true'
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "### Changes in this Release" > changelog.md
        echo "" >> changelog.md
        if [ -z "$PREV_TAG" ]; then
          git log --no-merges --pretty=format:"* %s (%h)" >> changelog.md
        else
          git log $PREV_TAG..HEAD --no-merges --pretty=format:"* %s (%h)" >> changelog.md
        fi

    - name: Create GitHub Release
      if: env.PUBLISH_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.semVer }}
        name: Release v${{ steps.version.outputs.semVer }}
        body_path: changelog.md
        generate_release_notes: true
        files: app/build/outputs/apk/release/com.novasoftware.hadoorbell-*.apk
