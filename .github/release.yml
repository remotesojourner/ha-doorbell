changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
    - title: 🧰 Maintenance & Refactoring
      labels:
        - refactor
        - chore
        - cleanup
    - title: 📦 Dependency Updates
      labels:
        - dependencies
    - title: 📖 Documentation
      labels:
        - documentation
        - docs
    - title: 🧪 Testing
      labels:
        - test
        - testing
    - title: 🛠️ Other Changes
      labels:
        - "*"
